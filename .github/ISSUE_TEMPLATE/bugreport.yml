name: Bug Report
description: Create a report to help fix issues.
body:
- type: markdown
  attributes:
    value: |
      Report CordWipe bugs with a minimal reproduction. Never include tokens,
      private messages, account data, or unredacted screenshots.
      Search existing issues before submitting. Do not delete real messages to reproduce a bug.
- type: input
  attributes:
    label: CordWipe Version
    description: You can see the version in the bottom right corner or in the ViolentMonkey or TamperMonkey settings.
    placeholder: v0.0.0
  validations:
    required: true
- type: input
  attributes:
    label: Browser
    description: Browser name and version
    placeholder: 110.0.5481.177 (Official Build) (x86_64)
  validations:
    required: true
- type: input
  attributes:
    label: Extension
    description: Which extension are you using
    placeholder: ViolentMonkey / TamperMonkey / Other method
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    description: Tell us what you did!
    placeholder: |
      1. Something you did
      2. Something you did next
  validations:
    required: true
- type: textarea
  attributes:
    label: Actual results
    description: What happens after the above steps have been followed.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected results
    description: What should happen after the above steps have been followed.
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Bug affects
    options:
      - label: DMs
      - label: DMs (group)
      - label: Channels
      - label: Channel (NSFW)
- type: textarea
  attributes:
    label: Additional information & file uploads  
    description: |
      Use synthetic or fully redacted evidence only. Never share your authorization token.
      IMPORTANT: Make sure to verify you're not sharing any personal information. Redact any ID's or Names that might appear.
      Github Issues are publicly visible, do not post sensitive information here!
  validations:
    required: true
